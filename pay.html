<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Complete your payment &middot; Ridge Sound</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#05070b" />
<link rel="stylesheet" href="assets/site.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 264 264'%3E%3Cpath d='M50.2 158.2C58.8 117.3 143.2 158.2 143.2 158.2C143.2 158.2 119.7 119.2 87.2 105.5C61 94.5 6.2 105.5 6.2 105.5L87.2 3.6L258.2 158.2L241.2 258.5H150.2C150.2 258.5 43.3 191.3 50.2 158.2Z' fill='none' stroke='%237fe3ff' stroke-width='14'/%3E%3C/svg%3E" />
<style>
  .pay{max-width:min(56ch,100%);margin:0 auto;
       padding:clamp(72px,12vw,140px) var(--gut) clamp(64px,9vw,120px);
       min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .pay h1{margin:0 0 18px;font-family:var(--display);font-size:var(--t-head);
          font-weight:400;letter-spacing:.01em;color:var(--txt-hi)}
  .pay p{margin:0 0 20px;font-size:var(--t-body);line-height:1.8;color:var(--txt-dim)}
  .pay .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .pay .quiet{font-size:var(--t-small);color:var(--txt-faint)}
</style>
</head>
<body>

<main class="pay">
  <h1 id="head">Opening your payment&hellip;</h1>

  <p id="body">Your checkout should appear in a moment. If nothing happens, the
  payment link may have expired or already been completed.</p>

  <div class="acts">
    <a class="btn btn-ghost" href="https://license.ridgesound.com">Get your licence <span class="arw">&rarr;</span></a>
    <a class="btn btn-ghost" href="index.html">Back to Ridge Sound</a>
  </div>

  <p class="quiet" style="margin-top:26px">Stuck? <a href="mailto:support@ridgesound.com">support@ridgesound.com</a> reaches a human.</p>
</main>

<!-- Paddle's default payment link target.
     Paddle sends buyers here as pay.html?_ptxn=txn_... and Paddle.js opens the
     checkout for that transaction automatically once Initialize() has run —
     no Checkout.open() call needed. checkout.js supplies the token and the
     post-payment redirect to the licence portal. -->
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script src="assets/checkout.js"></script>
<script>
(function () {
  var hasTxn = new URLSearchParams(location.search).has('_ptxn');
  var cfg = window.RidgeSoundPaddle || {};
  if (hasTxn && cfg.ready) return;           // Paddle.js is taking it from here

  document.getElementById('head').textContent = hasTxn
    ? 'Checkout is not open yet'
    : 'Nothing to pay for here';

  document.getElementById('body').textContent = hasTxn
    ? 'This payment link cannot be opened right now. Email support and we will sort it out.'
    : 'This page is only used to complete a payment link sent by Paddle. If you came here to buy Fold EQ, start from the Ridge Sound home page.';
})();
</script>

</body>
</html>
